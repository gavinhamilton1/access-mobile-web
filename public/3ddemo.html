<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Babylon.js Viewer Demo</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1e1e38, #050510);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f5f5f5;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(90vw, 960px);
        max-height: 90vh;
        aspect-ratio: 16 / 9;
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4);
        background-color: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      header {
        position: absolute;
        inset: 24px 24px auto 24px;
        z-index: 2;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 18px;
        border-radius: 999px;
        background-color: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
      }

      header h1 {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0;
      }

      footer {
        position: absolute;
        inset: auto 0 16px 0;
        z-index: 2;
        display: flex;
        justify-content: center;
        font-size: 0.85rem;
        opacity: 0.7;
      }

      babylon-viewer {
        width: 100%;
        height: 100%;
      }

      @media (max-width: 768px) {
        body {
          align-items: stretch;
          padding: 0;
        }

        main {
          width: 100vw;
          height: 100vh;
          max-height: none;
          border-radius: 0;
          box-shadow: none;
          border: none;
        }

        header {
          inset: 16px 16px auto 16px;
        }

        footer {
          font-size: 0.75rem;
          inset: auto 0 24px 0;
        }
      }
    </style>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@babylonjs/viewer@8.0.0/dist/babylon-viewer.esm.min.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Toy Acrobatic Plane</h1>
      </header>

      <babylon-viewer
        alt="A red, personified toy plane with frowning eyes and gritted teeth flying against a blue sky."
        source="https://assets.babylonjs.com/meshes/Demos/optimized/acrobaticPlane_variants.glb"
        animation-auto-play
        camera-orbit="0.777 1.033 0.720"
        camera-target="0.023 0.110 0.027"
        clear-color="#00000000"
      ></babylon-viewer>

    </main>
  </body>
</html>
